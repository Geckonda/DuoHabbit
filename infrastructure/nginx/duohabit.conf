# nginx на хосте VPS: домен -> контейнеры (frontend:3000, backend:8005)
# /etc/nginx/sites-available/duohabit.conf -> симлинк в sites-enabled
# https добавляет certbot автоматически поверх этого файла (certbot --nginx)

server {
    listen 80;
    server_name duohabit.dotnetdon.ru;

    # /api/habits -> backend /habits (префикс срезается за счет trailing slash в обеих директивах)
    location /api/ {
        proxy_pass http://127.0.0.1:8005/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
