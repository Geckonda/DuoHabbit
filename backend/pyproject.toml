[project]
name = "duohabbit"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastapi[standard]>=0.115.0",
    "fastapi-users[sqlalchemy]>=15.0.0",
    "uvicorn[standard]>=0.34.0",
    "redis>=5.2.0",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"